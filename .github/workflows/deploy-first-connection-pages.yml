name: Deploy First Connection to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/first_connection/**"
      - ".github/workflows/deploy-first-connection-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload First Connection site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/first_connection

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
