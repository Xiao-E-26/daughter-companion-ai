name: Daughter Runtime Tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-tests.yml"
  push:
    branches:
      - "runtime/backend-v0.1"
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-tests.yml"

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check runtime
        run: deno check runtime/src/*.ts runtime/tests/*.ts
      - name: Run core logic tests
        run: deno test runtime/tests/*.test.ts
