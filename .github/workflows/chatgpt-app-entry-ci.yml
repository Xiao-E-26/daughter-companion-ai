name: XiaoAi ChatGPT App Entry CI

on:
  pull_request:
    paths:
      - "apps/chatgpt_app/**"
      - ".github/workflows/chatgpt-app-entry-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/chatgpt_app/**"
      - ".github/workflows/chatgpt-app-entry-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chatgpt_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run adapter tests
        run: npm test
      - name: Check server syntax
        run: node --check src/server.js
      - name: Check adapter syntax
        run: node --check src/native_entry_adapter.js
