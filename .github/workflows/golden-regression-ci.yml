
name: XiaoAi Golden Regression CI

on:
  pull_request:
    paths:
      - 'BEHAVIOR_MODE_ROUTER_*.md'
      - 'core/XIAOAI_BEHAVIOR_CORE_V1.md'
      - 'BEHAVIOR_FREEZE_BASELINE_V1.md'
      - 'runtime/**'
      - 'db/migrations/**'
      - 'supabase/functions/**'
      - 'tests/golden/**'
      - 'tests/runtime/**'
      - 'tests/conversation/**'
      - '.github/workflows/golden-regression-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'BEHAVIOR_MODE_ROUTER_*.md'
      - 'core/XIAOAI_BEHAVIOR_CORE_V1.md'
      - 'BEHAVIOR_FREEZE_BASELINE_V1.md'
      - 'runtime/**'
      - 'db/migrations/**'
      - 'supabase/functions/**'
      - 'tests/golden/**'
      - 'tests/runtime/**'
      - 'tests/conversation/**'
      - '.github/workflows/golden-regression-ci.yml'

jobs:
  golden-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected Behavior Logic is unchanged
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$BASE_SHA"
          PROTECTED=(
            "core/XIAOAI_BEHAVIOR_CORE_V1.md"
            "BEHAVIOR_FREEZE_BASELINE_V1.md"
            "BEHAVIOR_MODE_ROUTER_V1.md"
            "runtime/behavior_mode_router.py"
          )
          if ! git diff --quiet "$BASE_SHA" HEAD -- "${PROTECTED[@]}"; then
            echo "ERROR: Behavior Logic protection triggered."
            git diff --name-only "$BASE_SHA" HEAD -- "${PROTECTED[@]}"
            exit 1
          fi
          echo "Behavior Logic protected files are unchanged."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - name: Run Golden + full runtime regression tests
        run: >-
          python -m pytest -q
          tests/golden
          tests/runtime
          tests/conversation
          tests/test_persona_gate.py
          tests/test_persona_gateway.py
