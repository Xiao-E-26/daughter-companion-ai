<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7fb">
  <title>小爱</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff7fb;color:#2f2a35}
    body{min-height:100vh}
    .wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 30px)}
    .top{display:flex;align-items:center;gap:14px}
    .avatar{width:64px;height:64px;border-radius:22px;background:#ffd9ea;display:grid;place-items:center;font-size:32px;box-shadow:0 8px 24px rgba(61,44,66,.08)}
    h1{font-size:30px;line-height:1.1;margin:0 0 5px}
    .sub{font-size:15px;color:#7b7181}
    .hello{margin:28px 0 20px;padding:21px;border-radius:26px;background:#fff;box-shadow:0 10px 30px rgba(61,44,66,.08);font-size:21px;line-height:1.55}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .card{appearance:none;border:0;background:#fff;border-radius:24px;padding:20px 15px;min-height:132px;text-align:left;box-shadow:0 8px 24px rgba(61,44,66,.07);font:inherit;font-size:18px;font-weight:700;color:#2f2a35}
    .icon{display:block;font-size:31px;margin-bottom:12px}
    .small{display:block;margin-top:6px;font-size:13px;line-height:1.4;font-weight:500;color:#847889}
    .memory{margin-top:18px;padding:17px 18px;border-radius:20px;background:#fff0f6;font-size:14px;line-height:1.6;color:#665b6b}
    .chat{margin-top:18px;display:flex;gap:10px}
    .chat input{min-width:0;flex:1;border:1px solid #eadde5;border-radius:20px;padding:15px 16px;font-size:16px;background:#fff;color:#776d7b}
    .chat button{border:0;border-radius:20px;padding:0 19px;font-size:20px;background:#2f2a35;color:#fff;opacity:.55}
    .foot{text-align:center;margin-top:18px;font-size:12px;color:#9b8f9f}
    @media(max-width:380px){.wrap{padding-left:15px;padding-right:15px}.grid{gap:11px}.card{min-height:124px;padding:17px 13px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="avatar">🌷</div>
      <div><h1>小爱</h1><div class="sub">雨宸的陪伴小伙伴</div></div>
    </header>

    <section class="hello">嗨，雨宸 👋<br>今天想跟小爱聊什么？</section>

    <section class="grid" aria-label="小爱功能预览">
      <button class="card"><span class="icon">💬</span>跟小爱聊天<span class="small">说说今天发生的事情</span></button>
      <button class="card"><span class="icon">⭐️</span>我的记忆<span class="small">看看小爱记住的开心事</span></button>
      <button class="card"><span class="icon">🎲</span>一起玩<span class="small">笑话、故事和小游戏</span></button>
      <button class="card"><span class="icon">🆘</span>我需要帮助<span class="small">害怕、被欺负或不舒服时</span></button>
    </section>

    <div class="memory">🔒 小爱不会把每句话都存下来。只有你明确说“帮我记住”时，才会进入长期记忆流程。</div>

    <div class="chat">
      <input value="跟小爱说句话…" disabled aria-label="聊天输入预览">
      <button disabled aria-label="发送预览">➤</button>
    </div>

    <div class="foot">UI Preview · 目前只看界面，不连接记忆与数据库</div>
  </main>
</body>
</html>
