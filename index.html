<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daughter Companion AI</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #172033;
    }
    main {
      width: min(92%, 760px);
      background: white;
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 16px 50px rgba(23,32,51,.10);
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eef2ff;
      font-weight: 600;
      font-size: 14px;
    }
    h1 { font-size: clamp(36px, 7vw, 64px); margin: 20px 0 12px; }
    p { font-size: 18px; line-height: 1.7; color: #536075; }
    .status { margin-top: 28px; font-weight: 700; color: #1f7a4d; }
    @media (prefers-color-scheme: dark) {
      body { background: #0e1320; color: #eef2ff; }
      main { background: #171e2e; }
      p { color: #b9c2d3; }
      .badge { background: #252e46; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Daughter Project</span>
    <h1>Daughter Companion AI</h1>
    <p>一个长期成长、陪伴、学习与解决问题的 AI companion project。</p>
    <p>当前网页作为项目入口，后续可逐步连接身份、成长、Guardian、权限、记忆与运行层。</p>
    <div class="status">● Project online</div>
  </main>
</body>
</html>
