<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小爱授权</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:560px;margin:40px auto;padding:0 20px;line-height:1.5;background:#fafafa;color:#111}
    .card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
    input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #ccc}
    input{width:100%;box-sizing:border-box;margin:8px 0 12px}
    button{cursor:pointer;margin-right:8px}
    .primary{background:#111;color:#fff;border-color:#111}.danger{background:#fff;color:#a00}
    .muted{color:#666;font-size:.92rem}.hidden{display:none}.status{margin-top:14px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="card">
    <h1>小爱授权</h1>
    <p class="muted">用于让 ChatGPT 以你自己的 Supabase 身份连接小爱。不会因为聊天里说“我是妈妈”就授予权限。</p>

    <div id="loginBox" class="hidden">
      <label>登录邮箱</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@example.com" />
      <button id="sendLink" class="primary">发送登录链接</button>
      <p class="muted">登录后会回到本页，并继续当前授权请求。</p>
    </div>

    <div id="consentBox" class="hidden">
      <p><strong>请求应用：</strong><span id="clientName"></span></p>
      <p><strong>请求权限：</strong><span id="scope"></span></p>
      <p><strong>当前账号：</strong><span id="currentUser"></span></p>
      <button id="approve" class="primary">允许</button>
      <button id="deny" class="danger">拒绝</button>
    </div>

    <div id="doneBox" class="hidden">
      <p>此授权请求已经处理，正在返回应用。</p>
    </div>

    <div id="status" class="status muted">正在检查授权状态…</div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';

    const SUPABASE_URL = 'https://vmegjuceiuplqixizwso.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_iyGQ_OSRQgkT5Vb3Z_ASsQ_f0OrOEx4';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const qs = new URLSearchParams(location.search);
    const authorizationId = qs.get('authorization_id');
    const loginBox = document.getElementById('loginBox');
    const consentBox = document.getElementById('consentBox');
    const doneBox = document.getElementById('doneBox');
    const status = document.getElementById('status');

    function show(el){ el.classList.remove('hidden'); }
    function hide(el){ el.classList.add('hidden'); }
    function setStatus(msg){ status.textContent = msg; }

    async function load() {
      if (!authorizationId) {
        setStatus('缺少 authorization_id。请从 ChatGPT 的连接流程重新进入。');
        return;
      }

      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if (!user) {
        hide(consentBox); show(loginBox);
        setStatus('请先登录与小爱绑定的 Supabase 账号。');
        return;
      }

      hide(loginBox);
      const { data, error } = await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
      if (error) {
        setStatus(`无法读取授权请求：${error.message}`);
        return;
      }

      if (data?.redirect_url && !data?.authorization_id) {
        show(doneBox);
        setStatus('已授权，正在返回…');
        location.href = data.redirect_url;
        return;
      }

      document.getElementById('clientName').textContent = data?.client?.name || 'ChatGPT / MCP Client';
      document.getElementById('scope').textContent = data?.scope || 'email';
      document.getElementById('currentUser').textContent = user.email || user.id;
      show(consentBox);
      setStatus('确认后，ChatGPT 将获得代表这个账号调用小爱 MCP 工具的访问令牌。');
    }

    document.getElementById('sendLink').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) return setStatus('请输入邮箱。');
      const redirectTo = location.href;
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: redirectTo, shouldCreateUser: false }
      });
      setStatus(error ? `发送失败：${error.message}` : '登录链接已发送，请打开最新邮件中的链接。');
    };

    document.getElementById('approve').onclick = async () => {
      const { data, error } = await supabase.auth.oauth.approveAuthorization(authorizationId);
      if (error) return setStatus(`授权失败：${error.message}`);
      if (data?.redirect_url) location.href = data.redirect_url;
    };

    document.getElementById('deny').onclick = async () => {
      const { data, error } = await supabase.auth.oauth.denyAuthorization(authorizationId);
      if (error) return setStatus(`拒绝失败：${error.message}`);
      if (data?.redirect_url) location.href = data.redirect_url;
    };

    await load();
  </script>
</body>
</html>
