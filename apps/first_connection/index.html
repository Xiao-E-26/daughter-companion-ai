<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daughter · First Connection</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f7; color: #111; }
    main { width: min(92vw, 560px); background: white; border-radius: 24px; padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 28px; }
    .phrase { padding: 16px; border-radius: 16px; background: #f1f1f1; line-height: 1.6; }
    button { width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 16px; font-size: 18px; cursor: pointer; }
    #status, #transcript, #response { margin-top: 16px; line-height: 1.6; }
    #response { font-weight: 600; }
    .muted { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>First Connection</h1>
    <p>雨宸，请按下按钮，然后对着麦克风说：</p>
    <div class="phrase">“Hi，我是曹雨宸，请连接 Daughter。”</div>
    <button id="connectButton">🎙️ 开始连接</button>
    <div id="status" class="muted">等待开始。</div>
    <div id="transcript"></div>
    <div id="response"></div>
  </main>

<script>
const button = document.getElementById('connectButton');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const responseEl = document.getElementById('response');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    statusEl.textContent = '正在听…';
    button.disabled = true;
  };

  recognition.onerror = (event) => {
    statusEl.textContent = '语音识别失败：' + event.error;
    button.disabled = false;
  };

  recognition.onend = () => {
    button.disabled = false;
  };

  recognition.onresult = async (event) => {
    const transcript = event.results[0][0].transcript;
    transcriptEl.textContent = '我听到：' + transcript;
    statusEl.textContent = '正在建立连接…';

    try {
      const res = await fetch('/api/first-connection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transcript })
      });
      const data = await res.json();
      if (!res.ok || !data.connected) {
        statusEl.textContent = '还没有连接成功。';
        responseEl.textContent = data.reason || '请再试一次。';
        return;
      }
      statusEl.textContent = 'Connected';
      responseEl.textContent = data.response_text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(data.response_text));
      }
    } catch (err) {
      statusEl.textContent = '连接服务目前不可用。';
      responseEl.textContent = String(err);
    }
  };
}

button.addEventListener('click', () => {
  responseEl.textContent = '';
  transcriptEl.textContent = '';
  if (!recognition) {
    statusEl.textContent = '这个浏览器没有提供语音转文字接口。请改用支持 SpeechRecognition 的浏览器，或以后接正式语音输入。';
    return;
  }
  recognition.start();
});
</script>
</body>
</html>
